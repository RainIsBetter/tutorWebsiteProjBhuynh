name: Mirror for deployment


on: [push, delete]

jobs:
  git-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@github.com:ikatkov/tutorWebsiteProjBhuynh-mirror.git
          ssh_private_key:
            ${{ secrets.MIRROR_TOKEN }}
